name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native FFmpeg on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ffmpeg
      - name: Install FFmpeg on Ubuntu and Windows
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Verify media tools and runner architecture
        shell: bash
        run: |
          node -p "process.platform + '/' + process.arch"
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install yt-dlp==2026.10.26
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
